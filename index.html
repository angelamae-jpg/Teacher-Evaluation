<!DOCTYPE html>
<html>
<head>
<title>Teacher Evaluation</title>
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<link rel="manifest" href="manifest.json">


</head>
<body>

<center><h3>Teacher Evaluation</h3></center>

Teacher Name: <input type="text" id="teacher" placeholder="Enter Teacher Name" ><br><br>
Student Name: <input type="text" id="student" placeholder= "Enter Student Name"><br><br>
Grade: <input type="number" id="grade" placeholder="Enter Grade"><br><br>

<button onclick="check()"  class="btn btn-danger">Check</button>

<p id="result"></p>

<script>
function check(){
let grade = document.getElementById("grade").value;
let result = (grade >= 80) ? "SAGAD" : "LAWLAW";
document.getElementById("result").innerHTML = result;
}

if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('service-worker.js')
.then(function() {
console.log("Service Worker Registered");
});
}
</script>

</body>
</html>

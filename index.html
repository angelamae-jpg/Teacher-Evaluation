
<!DOCTYPE html>
<html>
<head>
<title>Teacher Evaluation</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#dc3545">
</head>
<body>

<div class="container mt-4">
  <div class="row">
    <div class="col-md-6 offset-md-3">
      <div class="card">
        <div class="card-header text-black">
          <h3 class="text-center">Teacher Evaluation</h3>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label for="teacher" class="form-label">Teacher Name:</label>
            <input type="text" class="form-control" id="teacher" placeholder="Enter Teacher Name">
          </div>
          
          <div class="mb-3">
            <label for="student" class="form-label">Student Name:</label>
            <input type="text" class="form-control" id="student" placeholder="Enter Student Name">
          </div>
          
          <div class="mb-3">
            <label for="grade" class="form-label">Grade:</label>
            <input type="number" class="form-control" id="grade" placeholder="Enter Grade">
          </div>
          
          <button onclick="check()" class="btn btn-danger w-100">Check</button>
          
          <div class="mt-3">
            <p id="result" class="h4 text-center"></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function check() {
  let grade = document.getElementById("grade").value;
  let teacher = document.getElementById("teacher").value;
  let student = document.getElementById("student").value;
  
  if (!teacher || !student || !grade) {
    document.getElementById("result").innerHTML = "Please fill all fields";
    document.getElementById("result").className = "text-warning";
    return;
  }
  
  let result = (grade >= 80) ? "SAGAD" : " LAWLAW ";
  let resultElement = document.getElementById("result");
  resultElement.innerHTML = `${student} - ${result}`;
  resultElement.className = (grade >= 80) ? "text-success" : "text-danger";
}


if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js')
      .then(function(registration) {
        console.log('Service Worker registered with scope:', registration.scope);
      })
      .catch(function(error) {
        console.log('Service Worker registration failed:', error);
      });
  });
}
</script>

</body>
</html>
